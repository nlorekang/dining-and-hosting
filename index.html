<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Kitchen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#faf5ee;--card:#fff;--ink:#2b2118;--mut:#7a6a5a;--line:#eadfd0;--acc:#b5482f;--sweet:#e8a0b4;--sav:#9bb88a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1612;--card:#2a211b;--ink:#f3e9dc;--mut:#b3a291;--line:#3a2f27;--acc:#e07a5f;--sweet:#8a4a5c;--sav:#4f6a44}}
:root[data-theme="dark"]{--bg:#1c1612;--card:#2a211b;--ink:#f3e9dc;--mut:#b3a291;--line:#3a2f27;--acc:#e07a5f;--sweet:#8a4a5c;--sav:#4f6a44}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:16px;padding-bottom:80px}
h1,h2,h3,.serif{font-family:Fraunces,Georgia,serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:30px;margin:8px 0 14px}
.seg{display:flex;background:var(--line);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:11px;font:600 15px Inter,sans-serif;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px #0002}
input,textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:16px Inter,sans-serif;margin-bottom:10px}
textarea{min-height:120px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 2px 10px #0001;border:1px solid var(--line)}
.ph{height:110px;display:flex;align-items:center;justify-content:center;font-size:46px;background-size:cover;background-position:center}
.ph.sweet{background-color:var(--sweet)}.ph.savoury{background-color:var(--sav)}
.card .t{padding:10px 12px}.card h3{margin:0 0 2px;font-size:17px}
.mut{color:var(--mut);font-size:13px}
.hero{height:220px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:80px;background-size:cover;background-position:center;margin-bottom:14px}
.btn{border:0;background:var(--acc);color:#fff;padding:12px 18px;border-radius:14px;font:600 15px Inter,sans-serif}
.btn.g{background:var(--line);color:var(--ink)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid var(--line);line-height:1.4}
.item.done{opacity:.35;text-decoration:line-through}
.box{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--acc);display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;margin-top:1px}
.done .box{background:var(--acc)}
.num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px}
.done .num{background:var(--mut)}
.cook .item{font-size:var(--fs,20px)}
.note{background:var(--card);border-left:4px solid var(--acc);border-radius:10px;padding:12px;margin:16px 0}
.x{margin-left:auto;border:0;background:none;color:var(--mut);font-size:20px}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--card);border:1px solid var(--line);padding:8px 12px;border-radius:999px;margin:0 6px 6px 0;font-size:14px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;border:0;background:none;font:600 12px Inter,sans-serif;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:22px}nav button.on{color:var(--acc)}
.fab{position:fixed;right:18px;bottom:calc(86px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:30px;box-shadow:0 4px 14px #0004;z-index:6}
h2{font-size:22px;margin:22px 0 4px}
</style>
<style>
:root:not(.a):not(.b){--bg:#120d0a;--card:#1f1712;--ink:#f7eee3;--mut:#ad9a87;--line:#342920;--acc:#ff8a4c;color-scheme:dark}
body,input,textarea,select,button{font-family:'DM Sans',system-ui,sans-serif}
body{background:radial-gradient(120% 55% at 50% -8%,#4a2314 0,transparent 62%),radial-gradient(80% 40% at 100% 100%,#2a0f1f 0,transparent 70%),var(--bg);background-attachment:fixed;font-size:17px}
h1,h2,h3,.serif{font-family:'Bricolage Grotesque','DM Sans',sans-serif}
h1{font-size:44px;font-weight:800;letter-spacing:-.035em;line-height:1;margin:14px 0 18px}
h2{font:700 12px 'DM Sans',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);margin:30px 0 4px}
.seg{background:#ffffff12;border-radius:999px;padding:4px}
.seg button{border-radius:999px;font-weight:700;transition:.25s}
.seg button.on{background:linear-gradient(135deg,#ff9a5c,#ff5d7a);color:#1a0d08;box-shadow:0 4px 16px #ff5d7a55}
input,textarea,select{background:#ffffff0d;border:1px solid #ffffff1c;border-radius:16px;color:var(--ink)}
.btn{background:linear-gradient(135deg,#ff9a5c,#ff5d7a);color:#1a0d08;border-radius:999px;padding:13px 22px;font-weight:700}
.btn.g{background:#ffffff14;color:var(--ink);backdrop-filter:blur(12px)}
.grid{gap:14px}
.card{position:relative;aspect-ratio:3/4;border:0;border-radius:26px;box-shadow:0 14px 34px #0008;animation:up .6s cubic-bezier(.2,.8,.2,1) both;transition:transform .2s}
.card:nth-child(2){animation-delay:.07s}.card:nth-child(3){animation-delay:.14s}.card:nth-child(4){animation-delay:.21s}.card:active{transform:scale(.96)}
@keyframes up{from{opacity:0;transform:translateY(22px) scale(.97)}}
.card .ph{position:absolute;inset:0;height:auto}
.card .t{position:absolute;left:0;right:0;bottom:0;padding:60px 16px 16px;background:linear-gradient(transparent,#000c)}
.card h3{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.05;color:#fff;margin-bottom:6px}
.card .mut{color:#ffffffc0}
.ph{position:relative;background-size:cover;background-position:center}
.ph.sweet{background-color:#4a1230;background-image:radial-gradient(60% 55% at 15% 12%,#ff7a59,transparent 70%),radial-gradient(55% 50% at 90% 28%,#d63384,transparent 70%),radial-gradient(70% 55% at 50% 100%,#ffb36b,transparent 72%)}
.ph.savoury{background-color:#12261b;background-image:radial-gradient(60% 55% at 12% 15%,#e9b44c,transparent 70%),radial-gradient(55% 50% at 92% 30%,#6f9440,transparent 70%),radial-gradient(70% 55% at 45% 100%,#1f6b52,transparent 72%)}
.grain{position:absolute;inset:0;opacity:.28;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
.card .ph::after{content:attr(class);display:none}
.hero{height:340px;margin:-16px -16px 18px;border-radius:0 0 36px 36px;box-shadow:0 20px 40px #0008;position:relative}
.cook h1{font-size:40px}
.cook>.row:first-child{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;z-index:4;margin:0}
.cook>.row:first-child .btn.g{background:#0007}
.item{border-bottom:1px solid #ffffff12;padding:15px 4px}
.box{border-radius:50%;border-color:#ffffff40;width:28px;height:28px}
.done .box{background:var(--acc);border-color:var(--acc);color:#1a0d08}
.num{background:linear-gradient(135deg,#ff9a5c,#ff5d7a);color:#1a0d08;font-weight:800;width:34px;height:34px}
.note{background:#ffffff0d;border:1px solid #ffffff14;border-left:4px solid var(--acc);border-radius:18px}
.chip{background:#ffffff0f;border-color:#ffffff1c}
nav{left:50%;right:auto;transform:translateX(-50%);width:min(300px,calc(100% - 32px));bottom:calc(14px + env(safe-area-inset-bottom,0px));border-radius:999px;background:#1f1712cc;backdrop-filter:blur(18px);border:1px solid #ffffff1c;padding:6px;box-shadow:0 12px 30px #000a}
nav button{flex-direction:row;justify-content:center;border-radius:999px;padding:12px;font-size:14px;color:var(--mut);transition:.25s}
nav button span{display:none}
nav button.on{background:linear-gradient(135deg,#ff9a5c,#ff5d7a);color:#1a0d08}
.fab{background:linear-gradient(135deg,#ff9a5c,#ff5d7a);color:#1a0d08;bottom:calc(84px + env(safe-area-inset-bottom,0px));box-shadow:0 10px 28px #ff5d7a66}
</style>
<style>
:root:not(.a):not(.b){--bg:#0c0c0c;--card:#181818;--line:#2a2a2a;--acc:#ffc933;--mut:#a8a29a}
body{background:radial-gradient(110% 50% at 50% -10%,#3b2e08 0,transparent 62%),#0c0c0c}
.seg button.on,.btn,.num,nav button.on,.fab{background:linear-gradient(135deg,#ffd84d,#f59e0b);color:#161000}
.seg button.on{box-shadow:0 4px 16px #f59e0b55}
.fab{box-shadow:0 10px 28px #f59e0b66}
.btn.g{background:#ffffff14;color:#f7eee3}
.ph.sweet{background-color:#2a1d04;background-image:radial-gradient(65% 60% at 20% 10%,#ffd84d,transparent 70%),radial-gradient(60% 55% at 95% 40%,#f59e0b,transparent 70%),radial-gradient(80% 60% at 40% 105%,#b45309,transparent 75%)}
.ph.savoury{background-color:#1a1405;background-image:radial-gradient(65% 60% at 15% 12%,#f2c14e,transparent 70%),radial-gradient(60% 55% at 95% 35%,#9a6b12,transparent 72%),radial-gradient(80% 60% at 45% 105%,#3d2e0a,transparent 75%)}
nav{background:#141414d9}
.done .box{background:#ffc933;border-color:#ffc933;color:#161000}
.note{border-left-color:#ffc933}
</style>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0c0c0c"><link rel="apple-touch-icon" href="icons/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="My Kitchen"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"></head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<script>
const KEY='kitchen-v1';
const seed={recipes:[
{id:'r1',title:'Homemade vanilla ice cream',type:'sweet',emoji:'🍨',time:'30 min + 2 days freezing',serves:'8',ing:['500 ml fresh cream','250 ml full-cream milk','120 g sugar','1 vanilla pod','5 egg yolks'],steps:['Warm milk, cream and vanilla until steaming.','Whisk yolks and sugar until pale.','Temper the yolks with the hot milk, then cook gently until it coats a spoon.','Chill overnight, churn, then freeze for at least 2 days.'],notes:'Sample recipe: replace with your own.',img:''},
{id:'r2',title:'Rustic Christmas bread',type:'savoury',emoji:'🍞',time:'3 hrs',serves:'10',ing:['600 g bread flour','10 g salt','7 g instant yeast','400 ml warm water','2 tbsp olive oil'],steps:['Mix everything into a shaggy dough and rest 30 minutes.','Fold, then prove until doubled.','Shape, prove again, bake at 230°C for 35 minutes.'],notes:'',img:''},
{id:'r3',title:'Chocolate fudge cake',type:'sweet',emoji:'🍫',time:'1 hr 15',serves:'12',ing:['200 g dark chocolate','200 g butter','250 g sugar','4 eggs','150 g flour'],steps:['Melt chocolate and butter together.','Whisk in sugar and eggs, then fold in flour.','Bake at 170°C for 35 minutes.'],notes:'',img:''}],
plan:{menu:['r1','r2'],tasks:[{id:'t1',when:0,text:'Make the ice cream and freeze',done:false},{id:'t2',when:1,text:'Start the bread',done:false},{id:'t3',when:2,text:'Prepare sides, then serve',done:false}],shop:[{t:'Fresh cream',done:false},{t:'Vanilla pods',done:false}]}};
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.recipes)S=JSON.parse(JSON.stringify(seed));
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('Could not save: storage may be full. Try smaller photos.')}}
const WHEN=['2 days before','Christmas Eve','Christmas Day'];
let v={n:'list'},filter='sweet',q='',fs=20,ticks={},wl=null;
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
const rec=id=>S.recipes.find(r=>r.id===id);
const uid=()=>'i'+Math.random().toString(36).slice(2,9);
function go(n,id){v={n,id};ticks=n==='recipe'?ticks:ticks;scrollTo(0,0);draw();wake(n==='recipe')}
async function wake(on){try{if(on&&navigator.wakeLock){wl=await navigator.wakeLock.request('screen')}else if(wl){wl.release();wl=null}}catch(e){}}
function pic(r,cls){return `<div class="${cls} ${r.type}" style="${r.img?`background-image:url(${r.img})`:''}">${r.img?'':'<i class="grain"></i>'}</div>`}
function draw(){
 const a=$('app');
 $('nav').innerHTML=['list','host'].map(k=>`<button class="${(v.n==='host'?'host':'list')===k&&v.n!=='x'?'on':''}" onclick="go('${k}')"><span>${k==='list'?'📖':'🎄'}</span>${k==='list'?'Recipes':'Hosting'}</button>`).join('');
 const fab=document.querySelector('.fab');if(fab)fab.remove();
 if(v.n==='list'){
  const L=S.recipes.filter(r=>r.type===filter&&r.title.toLowerCase().includes(q.toLowerCase()));
  a.innerHTML=`<h1 class="serif">My Kitchen</h1>
  <div class="seg"><button class="${filter==='sweet'?'on':''}" onclick="filter='sweet';draw()">🍰 Sweet</button><button class="${filter==='savoury'?'on':''}" onclick="filter='savoury';draw()">🥘 Savoury</button></div>
  <input placeholder="Search recipes" value="${esc(q)}" oninput="q=this.value;draw();const i=document.querySelector('input');i.focus();i.setSelectionRange(q.length,q.length)">
  <div class="grid">${L.map(r=>`<div class="card" onclick="go('recipe','${r.id}')">${pic(r,'ph')}<div class="t"><h3 class="serif">${esc(r.title)}</h3><div class="mut">${esc(r.time)}</div></div></div>`).join('')||'<p class="mut">Nothing here yet. Tap + to add one.</p>'}</div>`;
  document.body.insertAdjacentHTML('beforeend','<button class="fab" onclick="newR()">+</button>');
 }else if(v.n==='recipe'){
  const r=rec(v.id);if(!r)return go('list');
  const T=ticks[r.id]||(ticks[r.id]={});
  a.className='cook';
  a.innerHTML=`<div class="row"><button class="btn g" onclick="go('list')">← Back</button><button class="btn g" onclick="fs=fs>=30?18:fs+4;draw()">Aa</button><button class="btn" style="margin-left:auto" onclick="go('edit','${r.id}')">✎ Edit</button></div>
  ${pic(r,'hero')}<h1 class="serif">${esc(r.title)}</h1><div class="mut">${esc(r.time)} · serves ${esc(r.serves)}</div>
  <h2 class="serif">Ingredients</h2><div style="--fs:${fs}px">${r.ing.map((x,i)=>x[0]==='#'?`<div class="mut" style="margin:22px 0 2px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:13px">${esc(x.slice(1).trim())}</div>`:`<div class="item ${T['i'+i]?'done':''}" onclick="tk('${r.id}','i${i}')"><div class="box">${T['i'+i]?'✓':''}</div><div>${esc(x)}</div></div>`).join('')}</div>
  <h2 class="serif">Method</h2><div style="--fs:${fs}px">${r.steps.map((x,i)=>`<div class="item ${T['s'+i]?'done':''}" onclick="tk('${r.id}','s${i}')"><div class="num">${i+1}</div><div>${esc(x)}</div></div>`).join('')}</div>
  ${r.notes?`<div class="note"><b>My notes</b><br>${esc(r.notes).replace(/\n/g,'<br>')}</div>`:''}`;
  document.getElementById('app').className='';
  a.className='cook';
 }else if(v.n==='edit'){
  const r=rec(v.id);a.className='';
  a.innerHTML=`<h1 class="serif">Edit recipe</h1>
  <input id="e_t" placeholder="Title" value="${esc(r.title)}">
  <div class="seg"><button id="bs" class="${r.type==='sweet'?'on':''}" onclick="setT('sweet')">🍰 Sweet</button><button id="bv" class="${r.type==='savoury'?'on':''}" onclick="setT('savoury')">🥘 Savoury</button></div>
  <div class="row"><input id="e_e" style="width:70px" value="${esc(r.emoji)}" placeholder="🍰"><input id="e_m" style="flex:1" placeholder="Time" value="${esc(r.time)}"><input id="e_s" style="width:80px" placeholder="Serves" value="${esc(r.serves)}"></div>
  <b>Ingredients</b> <span class="mut">(one per line)</span><textarea id="e_i">${esc(r.ing.join('\n'))}</textarea>
  <b>Method</b> <span class="mut">(one step per line)</span><textarea id="e_p" style="min-height:180px">${esc(r.steps.join('\n'))}</textarea>
  <b>My notes and tweaks</b><textarea id="e_n" placeholder="What did you change? What worked?">${esc(r.notes)}</textarea>
  <b>Photo</b><input type="file" accept="image/*" onchange="photo(this)"><button class="btn g" type="button" style="margin-bottom:12px" onclick="window.open('https://www.google.com/search?tbm=isch&q='+encodeURIComponent($('e_t').value+' recipe'),'_blank')">Find a photo online ↗</button>
  <div class="row"><button class="btn" onclick="saveR()">Save</button><button class="btn g" onclick="go('recipe','${r.id}')">Cancel</button><button class="btn g" style="margin-left:auto" onclick="delR()">Delete</button></div>`;
 }else if(v.n==='host'){return renderHost();
  const P=S.plan,opts=S.recipes.filter(r=>!P.menu.includes(r.id));
  a.className='';
  a.innerHTML=`<h1 class="serif">Christmas lunch</h1>
  <h2 class="serif">Menu</h2><div>${P.menu.map(id=>{const r=rec(id);return r?`<span class="chip" onclick="go('recipe','${id}')">${esc(r.emoji)} ${esc(r.title)} <button class="x" style="font-size:16px" onclick="event.stopPropagation();P_rm('${id}')">×</button></span>`:''}).join('')}</div>
  <select onchange="if(this.value){S.plan.menu.push(this.value);save();draw()}"><option value="">+ Add a dish from my recipes</option>${opts.map(r=>`<option value="${r.id}">${esc(r.title)}</option>`).join('')}</select>
  <h2 class="serif">Prep timeline</h2>
  ${WHEN.map((w,wi)=>`<div class="mut" style="margin-top:14px;font-weight:600;text-transform:uppercase;letter-spacing:.05em">${w}</div>${P.tasks.filter(t=>t.when===wi).map(t=>`<div class="item ${t.done?'done':''}" onclick="tt('${t.id}')"><div class="box">${t.done?'✓':''}</div><div>${esc(t.text)}</div><button class="x" onclick="event.stopPropagation();td('${t.id}')">×</button></div>`).join('')}`).join('')}
  <div class="row"><select id="tw" style="flex:1;margin:0">${WHEN.map((w,i)=>`<option value="${i}">${w}</option>`).join('')}</select></div>
  <div class="row"><input id="tn" placeholder="Add a task" style="flex:1;margin:0"><button class="btn" onclick="ta()">Add</button></div>
  <h2 class="serif">Shopping list</h2>
  ${P.shop.map((s,i)=>`<div class="item ${s.done?'done':''}" onclick="st(${i})"><div class="box">${s.done?'✓':''}</div><div>${esc(s.t)}</div><button class="x" onclick="event.stopPropagation();sd(${i})">×</button></div>`).join('')}
  <div class="row"><input id="sn" placeholder="Add an item" style="flex:1;margin:0"><button class="btn" onclick="sa()">Add</button></div>`;
 }
 if(v.n!=='recipe')a.className='';
}
function tk(id,k){ticks[id][k]=!ticks[id][k];const y=scrollY;draw();scrollTo(0,y)}
function newR(){const r={id:uid(),title:'New recipe',type:filter,emoji:filter==='sweet'?'🍰':'🥘',time:'',serves:'',ing:[],steps:[],notes:'',img:''};S.recipes.unshift(r);go('edit',r.id)}
let tmpType=null,tmpImg=null;
function setT(t){tmpType=t;$('bs').className=t==='sweet'?'on':'';$('bv').className=t==='savoury'?'on':''}
function photo(inp){const f=inp.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const m=800,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);tmpImg=c.toDataURL('image/jpeg',.72)};im.src=fr.result};fr.readAsDataURL(f)}
function lines(id){return $(id).value.split('\n').map(s=>s.trim()).filter(Boolean)}
function saveR(){const r=rec(v.id);r.title=$('e_t').value||'Untitled';r.emoji=$('e_e').value||'🍽️';r.time=$('e_m').value;r.serves=$('e_s').value;r.ing=lines('e_i');r.steps=lines('e_p');r.notes=$('e_n').value;if(tmpType)r.type=tmpType;if(tmpImg)r.img=tmpImg;tmpType=tmpImg=null;if(r.type!==filter)filter=r.type;save();go('recipe',r.id)}
function delR(){if(!confirm('Delete this recipe?'))return;S.recipes=S.recipes.filter(r=>r.id!==v.id);S.plan.menu=S.plan.menu.filter(i=>i!==v.id);save();go('list')}
function P_rm(id){S.plan.menu=S.plan.menu.filter(i=>i!==id);save();draw()}
function tt(id){const t=S.plan.tasks.find(t=>t.id===id);t.done=!t.done;save();draw()}
function td(id){S.plan.tasks=S.plan.tasks.filter(t=>t.id!==id);save();draw()}
function ta(){const x=$('tn').value.trim();if(!x)return;S.plan.tasks.push({id:uid(),when:+$('tw').value,text:x,done:false});save();draw()}
function st(i){S.plan.shop[i].done=!S.plan.shop[i].done;save();draw()}
function sd(i){S.plan.shop.splice(i,1);save();draw()}
function sa(){const x=$('sn').value.trim();if(!x)return;S.plan.shop.push({t:x,done:false});save();draw()}
draw();
</script>
<script>
const WH=['23 Dec · 2 days before','24 Dec · Christmas Eve','25 Dec · Christmas Day'];
const gi=s=>s.split('|').map(x=>{const k=x.lastIndexOf(' ');return{t:x.slice(0,k),p:+x.slice(k+1),done:false}});
const PLAN={v:2,
menu:[{c:'Appetizers',items:['Veggies, chips, cheeses, biscuits, dip','Ciabatta, butters, dip (SD tom + olive)']},{c:'Mains',items:['Rib eye, bacon wors, salmon, chicken','Veg skewers, mielie tert, German potato salad']},{c:'Dessert',items:['Ice cream, fruit']}],
tasks:[[0,'Ice cream',0],[1,'Ciabatta',30],[1,'Mielie tert',20],[1,'Butters',20],[1,'Dips',20],[1,'Marinate chicken',10],[2,'Potato salad',20],[2,'Veggies, cheese',10],[2,'Skewers',15],[2,'Cut fruit',15],[2,'Ciabatta',10],[2,'Steak, salmon',0]].map(a=>({when:a[0],text:a[1],mins:a[2],done:false})),
shop:[{g:'Pantry, drinks & braai',items:gi('Syrup 70|Condensed milk 30|Romany creams 30|Sweet corn 15|Chips 60|Biscuits 10|Charcoal 75|Coldrink 25|Tonic 30|Ice 25')},{g:'Meat, fish & dairy',items:gi('Cream 90|Halloumi 80|Sun-dried tomatoes 30|Steak 450|Salmon 300|Chicken 100|Wors 120')},{g:'Fresh produce & fruit',items:gi('Cucumber 10|Carrot 10|Baby marrow 20|Red onions 15|Mushroom 30|Pepper 20|Potatoes 20|Parsley 15|Garlic 15|Lemon 10|Blueberries 10|Strawberry 15|Pineapple 15|Grapes 50')}]};
if(!S.plan||S.plan.v!==2){S.plan=PLAN;save();}
const dur=m=>m>=60?Math.floor(m/60)+' h'+(m%60?' '+m%60+' min':''):m+' min';
const rd=()=>{const y=scrollY;save();draw();scrollTo(0,y)};
function renderHost(){
 const P=S.plan,a=$('app'),sum=g=>g.items.reduce((s,i)=>s+i.p,0),all=P.shop.reduce((s,g)=>s+sum(g),0);
 a.className='';
 a.innerHTML=`<h1 class='serif'>Christmas lunch</h1><div class='mut'>25 December · menu, prep and shopping</div>
<h2>Menu</h2>${P.menu.map((m,c)=>`<div style='font-weight:700;margin-top:14px'>${m.c}</div>${m.items.map((x,i)=>`<div class='item'><div style='flex:1'>${esc(x)}</div><button class='x' onclick='mrm(${c},${i})'>×</button></div>`).join('')}<div class='row'><input id='mi${c}' placeholder='Add to ${m.c.toLowerCase()}' style='flex:1;margin:0'><button class='btn' onclick='madd(${c})'>Add</button></div>`).join('')}
<h2>Prep timeline</h2>${WH.map((w,wi)=>{const L=P.tasks.map((t,i)=>({t,i})).filter(o=>o.t.when===wi),m=L.reduce((s,o)=>s+o.t.mins,0);return `<div class='row' style='margin-top:16px'><b>${w}</b><span class='mut' style='margin-left:auto'>${m?dur(m)+' total':''}</span></div>${L.map(o=>`<div class='item ${o.t.done?'done':''}' onclick='tt(${o.i})'><div class='box'>${o.t.done?'✓':''}</div><div style='flex:1'>${esc(o.t.text)}</div><span class='mut'>${o.t.mins?o.t.mins+' min':''}</span><button class='x' style='margin-left:6px' onclick='event.stopPropagation();td(${o.i})'>×</button></div>`).join('')}`}).join('')}
<div class='row'><select id='tw' style='flex:1;margin:0'>${WH.map((w,i)=>`<option value='${i}'>${w}</option>`).join('')}</select></div>
<div class='row'><input id='tn' placeholder='Add a task' style='flex:1;margin:0'><input id='tm' type='number' placeholder='min' style='width:72px;margin:0'><button class='btn' onclick='ta()'>Add</button></div>
<h2>Shopping list</h2>${P.shop.map((g,gi_)=>`<div class='row' style='margin-top:16px'><b>${g.g}</b><span class='mut' style='margin-left:auto'>R${sum(g)}</span></div>${g.items.map((it,i)=>`<div class='item ${it.done?'done':''}' onclick='st(${gi_},${i})'><div class='box'>${it.done?'✓':''}</div><div style='flex:1'>${esc(it.t)}</div><span class='mut'>R${it.p}</span><button class='x' style='margin-left:6px' onclick='event.stopPropagation();sd(${gi_},${i})'>×</button></div>`).join('')}`).join('')}
<div class='row' style='margin-top:18px'><b>Total</b><b style='margin-left:auto;color:var(--acc)'>R${all}</b></div>
<div class='row'><select id='sg' style='flex:1;margin:0'>${P.shop.map((g,i)=>`<option value='${i}'>${g.g}</option>`).join('')}</select></div>
<div class='row'><input id='sn' placeholder='Add an item' style='flex:1;margin:0'><input id='sp' type='number' placeholder='R' style='width:72px;margin:0'><button class='btn' onclick='sa()'>Add</button></div>`;
}
function mrm(c,i){S.plan.menu[c].items.splice(i,1);rd()}
function madd(c){const x=$('mi'+c).value.trim();if(!x)return;S.plan.menu[c].items.push(x);rd()}
function tt(i){S.plan.tasks[i].done=!S.plan.tasks[i].done;rd()}
function td(i){S.plan.tasks.splice(i,1);rd()}
function ta(){const x=$('tn').value.trim();if(!x)return;S.plan.tasks.push({when:+$('tw').value,text:x,mins:+$('tm').value||0,done:false});rd()}
function st(g,i){const it=S.plan.shop[g].items[i];it.done=!it.done;rd()}
function sd(g,i){S.plan.shop[g].items.splice(i,1);rd()}
function sa(){const x=$('sn').value.trim();if(!x)return;S.plan.shop[+$('sg').value].items.push({t:x,p:+$('sp').value||0,done:false});rd()}
draw();
</script>

<script>
(function(){try{const R={"id": "chel1", "title": "Chelsea buns", "type": "sweet", "emoji": "🥐", "time": "", "serves": "", "ing": ["# Tangzhong (method 1 only)", "¼ cup bread flour", "180ml milk", "# Dough (both methods)", "½ cup lukewarm milk", "½ pkt yeast", "2 eggs", "3 cups bread flour", "2 tbsp sugar", "½ tsp salt", "100g butter, soft", "# Filling", "75g salted butter, softened", "¼ cup brown sugar", "1 cup raisins", "2 tbsp ground cinnamon", "1 tbsp flour (to bind if still looking flat)", "# Topping", "¼ cup milk + 25g butter", "# Icing, option 1", "½ cup icing sugar", "1 tbsp milk", "Butter", "# Icing, option 2", "115g full-fat cream cheese, softened", "60g unsalted butter, softened", "1½ cups icing sugar, sifted", "1 tsp vanilla extract", "A pinch of salt", "Optional: 1–2 tbsp heavy cream or milk (only for a pourable glaze rather than a spreadable frosting)"], "steps": ["Manual/mixer method: combine all of the dough ingredients in a large mixing bowl, stirring till the mixture becomes cohesive. Knead it in an electric mixer, using the dough hook, for 15 minutes at medium speed.", "Place the dough in a lightly oiled bowl, turn to grease all sides, cover the bowl with a proof cover or plastic wrap, and let it rise for 60–90 minutes, till it’s nearly doubled in bulk.", "Mix the butter, brown sugar and cinnamon and spread. Sprinkle with raisins.", "Roll the dough into a log, and cut it into 9 slices. Place the buns in a lightly greased dish. Cover the pan with plastic wrap, and let the buns rise until they’re nearly doubled, about 45–60 minutes.", "Pour ½ cup milk around and a bit on top of the buns and cover with foil.", "Bake in a preheated 180°C oven for about 20 minutes, then 10 minutes without foil for browning.", "Crispy: use the ⅓ cup of milk/butter mixture. 20 minutes under the foil at 165°C, then 15 minutes without foil at 180°C.", "No-crisp: use the full ⅔ cup milk/butter mixture. 30 minutes under the foil, 10 minutes without, at 165°C the entire time."
